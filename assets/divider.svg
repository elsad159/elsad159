<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 4" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="scanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A371F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF7B72" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1" y="1.5" fill="url(#base)"/>
  <rect x="-300" width="300" height="4" rx="2" fill="url(#scanner)" opacity="0.9">
    <animate attributeName="x" from="-300" to="1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
