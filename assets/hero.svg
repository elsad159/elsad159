<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Elshad Khalilov — Mobile and App Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#1B2735"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF">
        <animate attributeName="stop-color" values="#58A6FF;#79C0FF;#58A6FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#A371F7">
        <animate attributeName="stop-color" values="#A371F7;#D2A8FF;#A371F7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FF7B72">
        <animate attributeName="stop-color" values="#FF7B72;#FFA198;#FF7B72" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0%" stop-color="#A371F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A371F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="0.4" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="600" cy="300" rx="520" ry="220" fill="url(#glow)"/>

  <!-- Floating particles -->
  <g>
    <circle cx="100" cy="60" r="2" fill="#58A6FF" opacity="0.7">
      <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="130" r="1.5" fill="#58A6FF" opacity="0.5">
      <animate attributeName="cy" values="130;110;130" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="220" r="2" fill="#A371F7" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="50" r="1.5" fill="#A371F7" opacity="0.5">
      <animate attributeName="cy" values="50;70;50" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="90" r="2" fill="#58A6FF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="180" r="1.5" fill="#FF7B72" opacity="0.5">
      <animate attributeName="cy" values="180;200;180" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="240" r="1.5" fill="#FF7B72" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Name -->
  <text x="600" y="138" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Inter, system-ui, sans-serif" font-size="78" font-weight="800" fill="url(#brand)">
    Elshad Khalilov
  </text>

  <!-- Animated underline -->
  <line x1="600" y1="158" x2="600" y2="158" stroke="url(#brand)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x1" from="600" to="430" dur="1.4s" fill="freeze"/>
    <animate attributeName="x2" from="600" to="770" dur="1.4s" fill="freeze"/>
  </line>

  <!-- Prompt + tagline -->
  <g font-family="JetBrains Mono, Menlo, monospace">
    <text x="600" y="200" text-anchor="middle" font-size="20">
      <tspan fill="#FF7B72">$</tspan>
      <tspan fill="#7EE787"> whoami</tspan>
    </text>
    <text x="600" y="232" text-anchor="middle" font-size="20" fill="#C9D1D9">
      Mobile &amp; App Developer · iOS · Android · Web
    </text>
    <text x="600" y="262" text-anchor="middle" font-size="14" fill="#6E7681">
      shipping under elshdma.online
    </text>
  </g>
</svg>
